[project]
name = "jmnav"
version = "0.1.0"
description = "A FastAPI web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
